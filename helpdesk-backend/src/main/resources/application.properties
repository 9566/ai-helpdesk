spring.application.name=helpdesk-backend
server.port=8080

# Database Configuration (Supabase PostgreSQL — Transaction Pooler)
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.nuibdcclkdqaavjafbvw
spring.datasource.password=${DB_PASSWORD:your_dev_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize Database
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Configuration
# Use a strong 256-bit (or more) secret key in production
jwt.secret=c3ByaW5nLWJvb3Qtand0LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cw==
jwt.expirationMs=86400000

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:your_dev_key}
gemini.api.model=gemini-2.0-flash
gemini.api.embedding-model=text-embedding-004
